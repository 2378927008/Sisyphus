name: Windows Installer Artifact

on:
  push:
    branches:
      - master
    paths:
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "assets/**"
      - "scripts/**"
      - "tests/**"
      - "vendor/.gitkeep"
      - ".github/workflows/windows-installer.yml"
  pull_request:
    branches:
      - master
    paths:
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "assets/**"
      - "scripts/**"
      - "tests/**"
      - "vendor/.gitkeep"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

jobs:
  windows-installer:
    name: Windows installer artifact
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare bundled llama.cpp runtime
        shell: pwsh
        run: .\scripts\setup-llm.ps1 -RuntimeOnly -NodeExe node

      - name: Run test suite
        run: npm test

      - name: Run application smoke
        run: npm run check:app

      - name: Run visual smoke
        run: npm run check:visual

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .tmp | Out-Null
          npm run dist:win 2>&1 | Tee-Object -FilePath .tmp/dist-win.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            exit $buildExitCode
          }

      - name: Check packaged startup
        run: npm run check:packaged

      - name: Check product readiness
        run: npm run check:product

      - name: Verify release artifacts
        run: npm run verify:release

      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          if-no-files-found: warn
          retention-days: 14
          path: |
            .tmp/dist-win.log
            dist/builder-debug.yml

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-flow-windows-installer
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Local Flow Setup 0.1.0.exe
            dist/Local Flow Setup 0.1.0.exe.blockmap
            dist/local-flow-release-build.json
            dist/win-unpacked/**
